services:
  api:
    build: .
    container_name: workspace-api-container
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: workspace-postgres
    environment:
      POSTGRES_DB: workspace_db
      POSTGRES_USER: workspace_user
      POSTGRES_PASSWORD: workspace_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace_user -d workspace_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data: